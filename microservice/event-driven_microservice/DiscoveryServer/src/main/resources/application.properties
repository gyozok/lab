spring.application.name=DiscoveryServer

server.port=8761
#We have only 1 server, but if we would have multiple Eureka server those should register itself too in the other discovery server
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
#Eureka advertise ip address instead of host names
eureka.instance.prefer-ip-address=true
#If you want to use hostname, you can specify it
#eureka.instance.hostname=localhost

#this is need to eureka client would register in eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
