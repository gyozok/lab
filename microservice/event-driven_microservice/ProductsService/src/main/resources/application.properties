spring.application.name=products-service

# random port
server.port=0

#Define the registry endpoint URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.preferIpAddress=true

# unique, random instance id
eureka.instance.instance-id=${spring.application.name}:${instanceId:${random.value}}

axon.axonserver.servers=localhost:8124
axon.serializer.general=xstream
axon.serializer.messages=xstream
axon.serializer.events=jackson
# gRPC setup
axon.axonserver.keep-alive-time=30000
axon.axonserver.keep-alive-timeout=15000
axon.axonserver.max-message-size=16777216
axon.axonserver.connect-timeout=30000

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
#spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:file:~/products;AUTO_SERVER=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

axon.eventhandling.processors.product-group.mode=subscribing

logging.level.org.axonframework.axonserver.connector.event.axon=debug